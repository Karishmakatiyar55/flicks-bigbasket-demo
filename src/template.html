<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110D0C">
<link rel="preconnect" href="https://flicks.flamapp.live" crossorigin>
<link rel="preconnect" href="https://native-ads-dev.appless.workers.dev" crossorigin>
<title>Flicks on bigbasket</title>
<style>
/*CSS*/

<body>
<header class="fhdr"><div class="lock"><img id="flamLogo" alt="Flam AI"><span class="dv"></span><img id="bbLogo" alt="bigbasket"></div></header>
<div class="page">
  <aside class="side" id="side" aria-label="Ad slots">
    <button class="sx" onclick="toggleGuide(false)" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <span class="kick">Flam × bigbasket</span>
    <h1>Flicks inside the bigbasket app.</h1>
    <p>Interactive video ads placed across home, search, categories, Smart Basket, the brand store, product pages and the basket. Tap an option inside any video and the product, price and button around it follow.</p>
    <div class="glist" id="glist"></div>
  </aside>
  <div class="phone-slot" id="phoneSlot"><div class="phone" id="phone">
    <div id="app">
      <div class="sbar" aria-hidden="true"><span>9:41</span><span class="ic"><svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="4" rx="1" fill="currentColor" opacity=".5"/></svg></span></div>
      <div id="view"></div>
      <div id="over"></div>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
  </div></div>
</div>
<div class="gscrim" id="gscrim"></div>
<button class="gpill" id="gpill" aria-expanded="false" aria-controls="side">Ad slots <i id="gcount">0</i></button>
<script>
/*DATA*/
/*APP*/
</script>
</body>
</html>
